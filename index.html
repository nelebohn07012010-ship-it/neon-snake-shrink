```html
<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Snake</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050a10;
      color: #39ffae;
      font: 16px monospace;
      text-align: center;
    }

    main {
      width: min(90vw, 400px);
      padding: 12px 0;
    }

    h2 {
      letter-spacing: 3px;
      margin: 8px 0 16px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #08121a;
      border: 1px solid #39ffae;
      border-radius: 4px;
      touch-action: none;
    }

    p {
      margin: 14px 0;
    }
  </style>
</head>

<body>
  <main>
    <h2>NEON SNAKE</h2>
    <p>PUNKTE: <b id="s">0</b> | BEST: <b id="b">0</b></p>
    <canvas id="c" width="300" height="300"></canvas>
    <p id="m">Pfeiltasten / WASD · Leertaste = Neustart</p>
  </main>

  <script>
    const canvas = document.querySelector("#c");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.querySelector("#s");
    const bestEl = document.querySelector("#b");
    const messageEl = document.querySelector("#m");

    const SIZE = 15;
    const CELL = 20;
    const START_MESSAGE = "Pfeiltasten / WASD · Leertaste = Neustart";

    let snake, direction, foodPosition, score = 0;
    let gameOver = false;
    let audio;

    let best = Number(localStorage.getItem("best")) || 0;
    bestEl.textContent = best;

    function placeFood() {
      const free = [];

      for (let x = 0; x < SIZE; x++) {
        for (let y = 0; y < SIZE; y++) {
          if (!snake.some(part => part[0] === x && part[1] === y)) {
            free.push([x, y]);
          }
        }
      }

      if (!free.length) {
        finishGame(true);
        return;
      }

      foodPosition = free[Math.random() * free.length | 0];
    }

    function reset() {
      snake = [[7, 7], [6, 7], [5, 7]];
      direction = [1, 0];
      score = 0;
      gameOver = false;
      scoreEl.textContent = "0";
      messageEl.textContent = START_MESSAGE;
      placeFood();
      draw();
    }

    function beep(startFrequency, endFrequency) {
      if (!audio) return;

      const oscillator = audio.createOscillator();
      const gain = audio.createGain();

      oscillator.frequency.value = startFrequency;
      gain.gain.value = 0.06;
      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start();
      oscillator.frequency.exponentialRampToValueAtTime(
        endFrequency, audio.currentTime + 0.12
      );
      gain.gain.exponentialRampToValueAtTime(
        0.001, audio.currentTime + 0.13
      );
      oscillator.stop(audio.currentTime + 0.14);
    }

    const keys = {
      arrowup: [0, -1], w: [0, -1],
      arrowdown: [0, 1], s: [0, 1],
      arrowleft: [-1, 0], a: [-1, 0],
      arrowright: [1, 0], d: [1, 0]
    };

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      if (keys[key] || key === " ") event.preventDefault();

      if (!audio) {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audio = new AudioContextClass();
      }

      if (audio?.state === "suspended") audio.resume();

      if (key === " " && gameOver) {
        reset();
        beep(440, 660);
        return;
      }

      const next = keys[key];
      if (
        next &&
        next[0] !== -direction[0] &&
        next[1] !== -direction[1] &&
        !gameOver
      ) {
        direction = next;
      }
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff7040";
      ctx.fillRect(
        foodPosition[0] * CELL + 3,
        foodPosition[1] * CELL + 3,
        14, 14
      );

      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#39ffae" : "#16bd80";
        ctx.fillRect(
          part[0] * CELL + 2,
          part[1] * CELL + 2,
          16, 16
        );
      });
    }

    function finishGame(won = false) {
      gameOver = true;
      messageEl.textContent = won
        ? "GEWONNEN! Spielfeld voll · Leertaste = Neustart"
        : "GAME OVER · Leertaste = Neustart";
      beep(440, 180);
    }

    function step() {
      if (gameOver) return;

      const head = [
        snake[0][0] + direction[0],
        snake[0][1] + direction[1]
      ];

      const eating =
        head[0] === foodPosition[0] &&
        head[1] === foodPosition[1];

      const body = eating ? snake : snake.slice(0, -1);

      if (
        head[0] < 0 || head[0] >= SIZE ||
        head[1] < 0 || head[1] >= SIZE ||
        body.some(part => part[0] === head[0] && part[1] === head[1])
      ) {
        finishGame();
        return;
      }

      snake.unshift(head);

      if (eating) {
        score += 10;
        scoreEl.textContent = score;

        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem("best", best);
        }

        placeFood();
        beep(520, 880);
      } else {
        snake.pop();
      }

      draw();
    }

    reset();
    setInterval(step, 150);
  </script>
</body>

</html>
