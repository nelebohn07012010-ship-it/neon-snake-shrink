<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neon Snake 3D</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: #050a10;
      color: #39ffae;
      font-family: monospace;
      display: grid;
      place-items: center;
      min-height: 100vh
    }

    main {
      width: min(94vw, 600px);
      text-align: center
    }

    canvas {
      width: 100%;
      display: block;
      border: 1px solid #164c40;
      border-radius: 12px;
      background: #050a10
    }

    h1 {
      letter-spacing: 5px
    }
  </style>
</head>

<body>
  <main>
    <h1>NEON SNAKE</h1>
    <canvas id="gl" width="600" height="600"></canvas>
    <p>3D WEBGL • NO LIBRARIES</p>
  </main>
  <script>
    const canvas = document.querySelector("#gl");
    const gl = canvas.getContext("webgl");
    if (!gl) throw Error("WebGL nicht verfügbar");

    // Vertex-Shader: Positionen in 3D umwandeln
    const vs = `
attribute vec3 pos;
uniform mat4 mvp;
void main(){
 gl_Position=mvp*vec4(pos,1.0);
}`;

    // Fragment-Shader: Farbe festlegen
    const fs = `
precision mediump float;
uniform vec4 color;
void main(){gl_FragColor=color;}`;

    function shader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw Error(gl.getShaderInfoLog(s));
      return s;
    }
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS))
      throw Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);

    const posLoc = gl.getAttribLocation(program, "pos");
    const mvpLoc = gl.getUniformLocation(program, "mvp");
    const colorLoc = gl.getUniformLocation(program, "color");

    // Matrix-Multiplikation
    function mul(a, b) {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++)
        for (let r = 0; r < 4; r++)
          for (let k = 0; k < 4; k++)
            o[c * 4 + r] += a[k * 4 + r] * b[c * 4 + k];
      return o;
    }
    function perspective(f, aspect, n, far) {
      const t = 1 / Math.tan(f / 2), d = 1 / (n - far);
      return new Float32Array([
        t / aspect, 0, 0, 0, 0, t, 0, 0,
        0, 0, (far + n) * d, -1, 0, 0, 2 * far * n * d, 0
      ]);
    }
    function lookAt(e, c, u) {
      let z = norm([e[0] - c[0], e[1] - c[1], e[2] - c[2]]);
      let x = norm(cross(u, z)), y = cross(z, x);
      return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -dot(x, e), -dot(y, e), -dot(z, e), 1
      ]);
    }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2] }
    function cross(a, b) {
      return [a[1] * b[2] - a[2] * b[1],
      a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]
    }
    function norm(a) { let l = Math.hypot(...a); return a.map(v => v / l) }

    // Spielfeld als 3D-Gitter auf XZ-Ebene
    const grid = [];
    for (let i = -5; i <= 5; i++) {
      grid.push(-5, -.02, i, 5, -.02, i);
      grid.push(i, -.02, -5, i, -.02, 5);
    }

    // Würfel aus Dreiecken
    const cube = [];
    function face(a, b, c, d) {
      cube.push(...a, ...b, ...c, ...a, ...c, ...d);
    }
    face([-.4, 0, .4], [.4, 0, .4], [.4, .8, .4], [-.4, .8, .4]);
    face([.4, 0, -.4], [-.4, 0, -.4], [-.4, .8, -.4], [.4, .8, -.4]);
    face([-.4, 0, -.4], [-.4, 0, .4], [-.4, .8, .4], [-.4, .8, -.4]);
    face([.4, 0, .4], [.4, 0, -.4], [.4, .8, -.4], [.4, .8, .4]);
    face([-.4, .8, .4], [.4, .8, .4], [.4, .8, -.4], [-.4, .8, -.4]);
    face([-.4, 0, -.4], [.4, 0, -.4], [.4, 0, .4], [-.4, 0, .4]);

    function buffer(data) {
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
      return b;
    }
    const gridBuf = buffer(grid);
    const cubeBuf = buffer(cube);

    function draw(buf, count, mode, mvp, color) {
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
      gl.uniformMatrix4fv(mvpLoc, false, mvp);
      gl.uniform4fv(colorLoc, color);
      gl.drawArrays(mode, 0, count);
    }
    function rotateY(a) {
      return new Float32Array([
        Math.cos(a), 0, -Math.sin(a), 0,
        0, 1, 0, 0,
        Math.sin(a), 0, Math.cos(a), 0,
        0, 0, 0, 1
      ]);
    }

    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(.015, .03, .05, 1);

    function render(time) {
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      const p = perspective(Math.PI / 4, 1, .1, 100);
      const v = lookAt([7, 8, 10], [0, 0, 0], [0, 1, 0]);
      const vp = mul(p, v);

      // Gitter
      draw(gridBuf, grid.length / 3, gl.LINES, vp,
        [.05, .28, .22, 1]);

      // Drehender 3D-Würfel
      const model = rotateY(time * .0005);
      draw(cubeBuf, cube.length / 3, gl.TRIANGLES,
        mul(vp, model), [.05, 1, .45, 1]);

      requestAnimationFrame(render);
    }
    render(0);
  </script>
</body>

</html>
